name: Cross-Repo PR Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-cross-repo-pr:
    name: Sync to Target Repo and Create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push Branch and Create or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          TARGET_REPO_SECRET: ${{ secrets.TARGET_REPO }}
          TARGET_REPO_VAR: ${{ vars.TARGET_REPO }}
          TARGET_BRANCH_SECRET: ${{ secrets.TARGET_BRANCH }}
          TARGET_BRANCH_VAR: ${{ vars.TARGET_BRANCH }}
          SYNC_BRANCH_SECRET: ${{ secrets.SYNC_BRANCH || secrets.SYNC_BRANCH_PREFIX }}
          SYNC_BRANCH_VAR: ${{ vars.SYNC_BRANCH || vars.SYNC_BRANCH_PREFIX }}
        run: |
          TARGET_REPO="${TARGET_REPO_SECRET:-$TARGET_REPO_VAR}"
          TARGET_BRANCH="${TARGET_BRANCH_SECRET:-${TARGET_BRANCH_VAR:-main}}"
          SYNC_BRANCH="${SYNC_BRANCH_SECRET:-${SYNC_BRANCH_VAR:-sync/main}}"

          if [ -z "$TARGET_REPO" ]; then
            echo "::warning::TARGET_REPO is not set. Please set TARGET_REPO in Repository Secrets or Variables if cross-repo sync is desired."
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "Error: CROSS_REPO_TOKEN secret is not set. Please add a Personal Access Token with repo permissions."
            exit 1
          fi

          echo "Configuring git identity..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true

          echo "Target repository: ${TARGET_REPO}"
          echo "Target base branch: ${TARGET_BRANCH}"
          echo "Sync branch: ${SYNC_BRANCH}"

          # Add target remote with token authentication
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"

          echo "Fetching target base branch ${TARGET_BRANCH}..."
          git fetch target "${TARGET_BRANCH}" || true

          TREE_SHA=$(git rev-parse HEAD^{tree})
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=format:"Sync updates: %s (%h)" HEAD)

          if git rev-parse --verify "target/${TARGET_BRANCH}" >/dev/null 2>&1; then
            PARENT_SHA=$(git rev-parse "target/${TARGET_BRANCH}")
            echo "Target base commit: ${PARENT_SHA:0:7}"
            SYNC_COMMIT=$(git commit-tree "${TREE_SHA}" -p "${PARENT_SHA}" -m "${COMMIT_MSG}")
          else
            echo "Target base branch not found; creating root commit..."
            SYNC_COMMIT=$(git commit-tree "${TREE_SHA}" -m "${COMMIT_MSG}")
          fi

          # Push sync commit to target repo sync branch
          echo "Pushing sync commit (${SYNC_COMMIT:0:7}) to target repository branch: ${SYNC_BRANCH}..."
          git push target "${SYNC_COMMIT}:refs/heads/${SYNC_BRANCH}" --force

          # Check if an open PR already exists for this branch in the target repo
          echo "Checking for existing pull requests..."
          EXISTING_PR=$(gh pr list --repo "${TARGET_REPO}" --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #${EXISTING_PR} already exists in ${TARGET_REPO}. The branch was updated automatically."
          else
            echo "Creating a new pull request in ${TARGET_REPO}..."
            SHORT_SHA="${GITHUB_SHA:0:7}"
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

            cat <<EOF > /tmp/pr_body.md
          ### Automated Sync PR

          Automated pull request triggered by push to \`${GITHUB_REF_NAME}\` in [${GITHUB_REPOSITORY}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          - **Source Repository:** ${GITHUB_REPOSITORY}
          - **Source Commit:** ${SHORT_SHA} (${GITHUB_SHA})
          - **Triggered By:** @${GITHUB_ACTOR}
          - **Timestamp:** ${TIMESTAMP}
          EOF

            gh pr create \
              --repo "${TARGET_REPO}" \
              --head "${SYNC_BRANCH}" \
              --base "${TARGET_BRANCH}" \
              --title "Sync: Updates from ${GITHUB_REPOSITORY} (${SHORT_SHA})" \
              --body-file /tmp/pr_body.md
          fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synctable - Workspace Dashboard</title>
  <script>
    (function() {
      try {
        var s = localStorage.getItem('synctable_theme');
        var d = s === 'dark' || ((!s || s === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        if (d) {
          r.classList.add('dark');
          r.classList.remove('light');
          r.setAttribute('data-theme', 'dark');
          r.style.colorScheme = 'dark';
        } else {
          r.classList.remove('dark');
          r.classList.add('light');
          r.setAttribute('data-theme', 'light');
          r.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen flex flex-col overflow-hidden select-none">
  <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
  <script type="module" src="index.js"></script>
</body>
</html>
